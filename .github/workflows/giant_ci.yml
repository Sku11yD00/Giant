name: 🦶 Giant CI
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Giant builds always use large world coordinates.
  SCONS_FLAGS: >-
    precision=double
    debug_symbols=no
  PYTHONIOENCODING: utf8

jobs:
  linux-editor:
    name: 🐧 Linux editor, tests and MCP check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: giant-linux-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin mesa-vulkan-drivers

      - name: Build
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} tests=yes

      - name: Save build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: giant-linux-editor
        continue-on-error: true

      - name: Engine unit tests
        run: ./bin/godot.linuxbsd.editor.double.x86_64 --headless --test --force-colors

      - name: MCP server end-to-end test
        run: python3 giant/tests/mcp_e2e.py ./bin/godot.linuxbsd.editor.double.x86_64

  windows-editor:
    name: 🏁 Windows editor (download from this run's artifacts)
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: giant-windows-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Direct3D 12 SDK installation failed, building with Vulkan only."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: ./.github/actions/godot-build
        with:
          platform: windows
          target: editor
          scons-flags: ${{ env.SCONS_FLAGS }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}

      - name: Save build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: giant-windows-editor
        continue-on-error: true

      - name: Check the editor starts
        run: ./bin/godot.windows.editor.double.x86_64.exe --version

      - name: Prepare artifact
        run: |
          Remove-Item bin/build_deps -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload Windows editor
        uses: ./.github/actions/upload-artifact
        with:
          name: giant-editor-windows
